<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalle Proyecto - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-folder2-open text-info"></i> <span th:text="${proyecto.codigo}">PROY</span> - <span th:text="${proyecto.cliente}">Cliente</span></h1>
        <p>Presupuesto: S/ <span th:text="${#numbers.formatDecimal(proyecto.presupuesto,1,2)}">0.00</span> | Inicio: <span th:text="${proyecto.fechaInicio}"></span></p>
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-light"><i class="bi bi-list-ul"></i> Solicitudes asociadas</div>
            <div class="card-body">
                <p class="text-muted" th:if="${proyecto.solicitudes == null or proyecto.solicitudes.isEmpty()}">Este proyecto no tiene solicitudes aún.</p>
                <a th:href="@{/produccion/solicitud/nueva/{id}(id=${proyecto.idProyecto})}" class="btn btn-sm btn-success mb-2"><i class="bi bi-plus"></i> Nueva solicitud</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
