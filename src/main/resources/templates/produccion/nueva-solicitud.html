<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nueva Solicitud - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-clipboard-plus text-info"></i> Nueva Solicitud de Materiales (BOM)</h1>
        <p class="text-muted">RF11 - Registra la lista de materiales (BOM) aprobada por el Diseñador Técnico para el proyecto.</p>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-light"><i class="bi bi-list-ol"></i> Items de la BOM</div>
            <div class="card-body">
                <form id="formSolicitud">
                    <input type="hidden" id="idProyecto" th:value="${idProyecto}"/>
                    <table class="table" id="tablaBom">
                        <thead class="table-primary">
                            <tr><th>#</th><th>Código material</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th><th class="text-end"><button type="button" class="btn btn-sm btn-success" onclick="addItem()"><i class="bi bi-plus"></i></button></th></tr>
                        </thead>
                        <tbody id="itemsBody"></tbody>
                        <tfoot>
                            <tr><td colspan="4" class="text-end"><strong>Total:</strong></td><td id="totalCell">S/ 0.00</td><td></td></tr>
                        </tfoot>
                    </table>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Registrar solicitud</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let contador = 0;
      function addItem() {
        contador++;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${contador}</td>
          <td><input type="text" class="form-control codigo" placeholder="7SJ62-..." required/></td>
          <td><input type="number" class="form-control cantidad" min="1" value="1" required oninput="recalcular()"/></td>
          <td><input type="number" step="0.01" class="form-control precio" value="0.00" oninput="recalcular()"/></td>
          <td class="subtotal">S/ 0.00</td>
          <td><button type="button" class="btn btn-sm btn-danger" onclick="this.closest('tr').remove();recalcular()"><i class="bi bi-x"></i></button></td>
        `;
        document.getElementById('itemsBody').appendChild(tr);
      }
      function recalcular() {
        let total = 0;
        document.querySelectorAll('#itemsBody tr').forEach(tr => {
          const c = parseFloat(tr.querySelector('.cantidad').value) || 0;
          const p = parseFloat(tr.querySelector('.precio').value) || 0;
          const sub = c * p;
          tr.querySelector('.subtotal').textContent = 'S/ ' + sub.toFixed(2);
          total += sub;
        });
        document.getElementById('totalCell').textContent = 'S/ ' + total.toFixed(2);
      }
      document.getElementById('formSolicitud').addEventListener('submit', async (e) => {
        e.preventDefault();
        const items = [];
        document.querySelectorAll('#itemsBody tr').forEach(tr => {
          items.push({
            codigoMaterial: tr.querySelector('.codigo').value,
            cantidad: parseInt(tr.querySelector('.cantidad').value),
            precioUnitario: parseFloat(tr.querySelector('.precio').value)
          });
        });
        const token = sessionStorage.getItem('jwt');
        const res = await fetch('/api/produccion/solicitudes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ idProyecto: parseInt(idProyecto.value), items })
        });
        const data = await res.json();
        if (data.exito) {
          alert('Solicitud registrada. Estado: ' + data.data.estado);
          location.href = '/produccion/proyectos';
        } else {
          alert('Error: ' + data.mensaje);
        }
      });
      addItem();
    </script>
</body>
</html>
