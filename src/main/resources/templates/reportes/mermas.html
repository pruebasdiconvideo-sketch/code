<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reporte de Mermas - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-file-earmark-bar-graph text-danger"></i> Reporte Consolidado de Mermas (RF27)</h1>
        <form method="get" th:action="@{/merma/reportes}" class="row g-2 mb-3">
            <div class="col-md-3"><input type="number" class="form-control" name="idProyecto" placeholder="ID Proyecto (opcional)"/></div>
            <div class="col-md-3"><input type="date" class="form-control" name="fechaInicio"/></div>
            <div class="col-md-3"><input type="date" class="form-control" name="fechaFin"/></div>
            <div class="col-md-3"><button class="btn btn-primary w-100"><i class="bi bi-search"></i> Filtrar</button></div>
        </form>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <table class="table table-sm table-hover">
                    <thead class="table-danger"><tr><th>Fecha</th><th>Proyecto</th><th>Material</th><th>Cant.</th><th>Tipo</th><th>Estado</th><th>Motivo</th></tr></thead>
                    <tbody>
                        <tr th:each="m : ${mermas}">
                            <td th:text="${m.fechaRegistro}">2026-01-01</td>
                            <td th:text="${m.proyecto.codigo}">PROY</td>
                            <td th:text="${m.material.codigo}">CODE</td>
                            <td th:text="${m.cantidad}">0</td>
                            <td><span class="badge bg-secondary" th:text="${m.tipo}">MERMA</span></td>
                            <td><span class="badge bg-info" th:text="${m.estado}">PENDIENTE</span></td>
                            <td th:text="${m.motivo} ?: ''">Mot</td>
                        </tr>
                        <tr th:if="${mermas.isEmpty()}"><td colspan="7" class="text-center text-muted py-3"><i class="bi bi-inbox"></i> Sin mermas en el rango seleccionado.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
