<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary" th:fragment="nav">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">
            <i class="bi bi-lightning-charge-fill"></i> Smart Power On
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}"><i class="bi bi-house-door"></i> Inicio</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ALMACENERO','ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/almacen/inventario}"><i class="bi bi-boxes"></i> Almacén</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('JEFE_PRODUCCION','ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/produccion/proyectos}"><i class="bi bi-clipboard-data"></i> Producción</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ALMACENERO','OPERARIO_ENSAMBLE','ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/despacho/bandeja}"><i class="bi bi-truck"></i> Despacho</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('INSPECTOR_CALIDAD','JEFE_PRODUCCION','ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/calidad/pruebas}"><i class="bi bi-clipboard-check"></i> Calidad</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ALMACENERO','OPERARIO_ENSAMBLE','JEFE_PRODUCCION','ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/merma/devoluciones}"><i class="bi bi-recycle"></i> Mermas</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/admin/usuarios}"><i class="bi bi-people"></i> Admin</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span sec:authentication="name">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2 py-1">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
