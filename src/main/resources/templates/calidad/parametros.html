<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Parámetros de Calidad - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-gear text-secondary"></i> Parámetros de Pruebas (RF21, R-CAL-01)</h1>
        <p class="text-muted">Configurados por el Administrador. Definen los rangos técnicos de tolerancia.</p>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-secondary">
                        <tr><th>Tipo</th><th>Nombre</th><th>Min</th><th>Max</th><th>Unidad</th><th>Activo</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${parametros}">
                            <td><span class="badge bg-info" th:text="${p.tipoPrueba}">TENSION</span></td>
                            <td th:text="${p.nombre}">Tensión</td>
                            <td th:text="${p.valorMinimo}">0</td>
                            <td th:text="${p.valorMaximo}">1000</td>
                            <td th:text="${p.unidad}">V</td>
                            <td><span class="badge bg-success" th:text="${p.activo} ? 'Sí' : 'No'">Sí</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
