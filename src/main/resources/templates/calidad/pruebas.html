<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pruebas de Calidad - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-clipboard-check text-warning"></i> Pruebas Funcionales y de Calidad</h1>
        <p class="text-muted">Proceso 4 - Control de Calidad (RF20-RF23)</p>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-warning text-dark"><i class="bi bi-clipboard-plus"></i> Registrar nueva prueba</div>
                    <div class="card-body">
                        <form id="formPrueba">
                            <div class="mb-3">
                                <label class="form-label">ID Proyecto *</label>
                                <input type="number" class="form-control" id="idProyecto" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Parámetro *</label>
                                <select class="form-select" id="idParametro">
                                    <option th:each="p : ${parametros}" th:value="${p.idParametro}" th:text="${p.tipoPrueba + ' - ' + p.nombre + ' (' + p.valorMinimo + '-' + p.valorMaximo + ' ' + p.unidad + ')'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Valor medido *</label>
                                <input type="number" step="0.001" class="form-control" id="valorMedido" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Observación</label>
                                <textarea class="form-control" id="observacion" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-warning w-100"><i class="bi bi-save"></i> Registrar prueba</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-info text-white"><i class="bi bi-file-pdf"></i> Generar certificado de conformidad (RF22)</div>
                    <div class="card-body">
                        <p class="text-muted">El certificado solo se emite si todas las pruebas vigentes del proyecto son CONFORMES (R-CAL-02).</p>
                        <div class="input-group mb-3">
                            <input type="number" class="form-control" id="idProyectoCert" placeholder="ID Proyecto"/>
                            <button class="btn btn-primary" onclick="descargarCertificado()"><i class="bi bi-download"></i> Descargar PDF</button>
                        </div>
                        <a th:href="@{/calidad/parametros}" sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-outline-secondary">
                            <i class="bi bi-gear"></i> Configurar parámetros
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('formPrueba').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = sessionStorage.getItem('jwt');
        const url = `/api/calidad/pruebas?idProyecto=${idProyecto.value}&idParametro=${idParametro.value}&valorMedido=${valorMedido.value}&observacion=${observacion.value}`;
        const res = await fetch(url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.exito) {
          alert('Prueba registrada. Resultado: ' + data.data.resultado);
          location.reload();
        } else {
          alert('Error: ' + data.mensaje);
        }
      });
      async function descargarCertificado() {
        const token = sessionStorage.getItem('jwt');
        const id = document.getElementById('idProyectoCert').value;
        const res = await fetch(`/api/calidad/proyectos/${id}/certificado.pdf`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          const blob = await res.blob();
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `certificado_proyecto_${id}.pdf`;
          link.click();
        } else {
          alert('No se pudo generar el certificado. Verifica que todas las pruebas estén CONFORMES.');
        }
      }
    </script>
</body>
</html>
