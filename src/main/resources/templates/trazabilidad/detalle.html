<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trazabilidad - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-clock-history text-info"></i> Trazabilidad del Material</h1>
        <p>Código: <code th:text="${codigo}">COD</code> (RF28 - histórico completo desde ingreso hasta montaje o devolución final)</p>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-info">
                            <tr><th>#</th><th>Tipo</th><th>Cantidad</th><th>Saldo</th><th>Proyecto/OC</th><th>Usuario</th><th>Fecha</th><th>Descripción</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${movimientos}">
                                <td th:text="${t.idTrazabilidad}">1</td>
                                <td><span class="badge"
                                          th:classappend="${t.tipoMovimiento == 'ENTRADA'} ? 'bg-success' : (${t.tipoMovimiento == 'SALIDA'} ? 'bg-warning text-dark' : (${t.tipoMovimiento == 'DEVOLUCION'} ? 'bg-info' : 'bg-danger'))"
                                          th:text="${t.tipoMovimiento}">ENTRADA</span></td>
                                <td th:text="${t.cantidad}">0</td>
                                <td th:text="${t.saldoResultante}">0</td>
                                <td>
                                    <span th:if="${t.proyecto != null}" th:text="${t.proyecto.codigo}">PROY</span>
                                    <span th:if="${t.ordenCompra != null}" th:text="'OC ' + ${t.ordenCompra.codigo}">OC</span>
                                </td>
                                <td th:text="${t.usuario.nombreCompleto}">Usuario</td>
                                <td th:text="${t.fechaMovimiento}">2026-01-01</td>
                                <td th:text="${t.descripcion}">Desc</td>
                            </tr>
                            <tr th:if="${movimientos.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-3"><i class="bi bi-inbox"></i> Sin movimientos.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <a th:href="@{/almacen/inventario}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
