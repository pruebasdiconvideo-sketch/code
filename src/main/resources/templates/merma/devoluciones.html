<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Devoluciones y Mermas - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-recycle text-danger"></i> Devoluciones y Mermas</h1>
        <p class="text-muted">Proceso 5 - Trazabilidad y Gestión de Mermas (RF24-RF28)</p>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-danger text-white"><i class="bi bi-inbox"></i> Pendientes de procesar</div>
                    <div class="card-body" th:if="${pendientes != null and !pendientes.isEmpty()}">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between" th:each="p : ${pendientes}">
                                <div>
                                    <strong th:text="${p.material.codigo}">CODE</strong>
                                    <span class="badge bg-warning text-dark" th:text="${p.tipo}">DEVOLUCION</span>
                                    <small class="d-block" th:text="${p.cantidad + ' unidades - ' + p.proyecto.codigo}">2 und - PROY</small>
                                </div>
                                <div>
                                    <button sec:authorize="hasAnyRole('ALMACENERO','ADMINISTRADOR')"
                                            th:if="${p.tipo == 'DEVOLUCION'}"
                                            class="btn btn-sm btn-success" th:onclick="'reintegrar(' + ${p.idMerma} + ')'">
                                        <i class="bi bi-check"></i> Reintegrar
                                    </button>
                                    <button sec:authorize="hasAnyRole('JEFE_PRODUCCION','ADMINISTRADOR')"
                                            th:if="${p.tipo == 'MERMA'}"
                                            class="btn btn-sm btn-danger" th:onclick="'validarMerma(' + ${p.idMerma} + ')'">
                                        <i class="bi bi-check-all"></i> Validar
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body" th:if="${pendientes == null or pendientes.isEmpty()}">
                        <p class="text-muted text-center mb-0"><i class="bi bi-check-circle"></i> No hay pendientes.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-light"><i class="bi bi-list-ul"></i> Historial completo</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover">
                                <thead class="table-secondary">
                                    <tr><th>#</th><th>Tipo</th><th>Material</th><th>Cant.</th><th>Proyecto</th><th>Estado</th><th>Fecha</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${mermas}">
                                        <td><code th:text="${m.idMerma}">1</code></td>
                                        <td><span class="badge" th:classappend="${m.tipo == 'MERMA'} ? 'bg-danger' : 'bg-info'" th:text="${m.tipo}">MERMA</span></td>
                                        <td th:text="${m.material.codigo}">CODE</td>
                                        <td th:text="${m.cantidad}">0</td>
                                        <td th:text="${m.proyecto.codigo}">PROY</td>
                                        <td>
                                            <span class="badge" th:classappend="${m.estado == 'MERMADO'} ? 'bg-danger' : (${m.estado == 'REINTEGRADO'} ? 'bg-success' : 'bg-warning text-dark')"
                                                  th:text="${m.estado}">PENDIENTE</span>
                                        </td>
                                        <td th:text="${m.fechaRegistro}">2026-01-01</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <a th:href="@{/merma/reportes}" sec:authorize="hasAnyRole('JEFE_PRODUCCION','ADMINISTRADOR')" class="btn btn-outline-primary">
                <i class="bi bi-file-earmark-bar-graph"></i> Reporte consolidado de mermas (RF27)
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function reintegrar(id) {
        if (!confirm('¿Reintegrar las unidades al stock?')) return;
        const token = sessionStorage.getItem('jwt');
        const res = await fetch(`/api/merma/devoluciones/${id}/reintegrar`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.exito) { alert('Stock reintegrado.'); location.reload(); } else { alert('Error: ' + data.mensaje); }
      }
      async function validarMerma(id) {
        if (!confirm('¿Validar la baja por merma? Esta acción es definitiva.')) return;
        const token = sessionStorage.getItem('jwt');
        const res = await fetch(`/api/merma/mermas/${id}/validar`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.exito) { alert('Baja validada.'); location.reload(); } else { alert('Error: ' + data.mensaje); }
      }
    </script>
</body>
</html>
