<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ingreso - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-box-arrow-in-down text-primary"></i> Ingreso Validado contra Orden de Compra</h1>
        <p class="text-muted">RF06, P1-RN02 - El stock solo aumenta si el código coincide con una OC PENDIENTE o CONFORME.</p>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form id="formIngreso">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Código del material *</label>
                            <input type="text" class="form-control" id="codigoMaterial" required/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad *</label>
                            <input type="number" class="form-control" id="cantidad" min="1" required/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Orden de compra *</label>
                            <select class="form-select" id="idOrdenCompra" required>
                                <option value="">Selecciona una OC</option>
                                <option th:each="oc : ${ordenesCompra}" th:value="${oc.idOrdenCompra}" th:text="${oc.codigo + ' - ' + oc.proveedor + ' (' + oc.estado + ')'}">OC-001</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-save"></i> Registrar ingreso</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('formIngreso').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = sessionStorage.getItem('jwt');
        const url = `/api/almacen/materiales/${codigoMaterial.value}/ingreso?cantidad=${cantidad.value}&idOrdenCompra=${idOrdenCompra.value}`;
        const res = await fetch(url, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.exito) { alert('Ingreso registrado. Stock actualizado.'); location.href = '/almacen/inventario'; }
        else { alert('Error: ' + data.mensaje); }
      });
    </script>
</body>
</html>
