<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h3 class="mb-0"><i class="bi bi-shield-lock-fill"></i> Smart Power On S.A.C.</h3>
                        <p class="small mb-0">Sistema de Gestión de Procesos</p>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle-fill"></i> Sesión cerrada correctamente
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="username">
                                    <i class="bi bi-envelope"></i> Correo electrónico
                                </label>
                                <input type="email" class="form-control" id="username" name="username"
                                       placeholder="admin@smartpoweron.pe" required autofocus/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">
                                    <i class="bi bi-lock"></i> Contraseña
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="********" required/>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                            </button>
                        </form>
                        <hr/>
                        <div class="small text-muted">
                            <p class="mb-1"><strong>Credenciales semilla:</strong></p>
                            <ul class="mb-0">
                                <li><code>admin@smartpoweron.pe</code> / <code>Clave123$</code></li>
                                <li><code>jefe@smartpoweron.pe</code> / <code>Clave123$</code></li>
                                <li><code>almacen@smartpoweron.pe</code> / <code>Clave123$</code></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/login.js}"></script>
</body>
</html>
