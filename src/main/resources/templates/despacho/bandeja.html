<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bandeja de Despachos - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4">
        <h1 class="h3 mb-3"><i class="bi bi-truck text-success"></i> Bandeja de Despachos y Entregas</h1>
        <p class="text-muted">Proceso 3 - Despacho y Entrega de Kits en Almacén (RF15-RF19)</p>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-success">
                            <tr><th># Despacho</th><th>Proyecto</th><th>Solicitud</th><th>Tipo</th><th>Estado</th><th>Almacenero</th><th>Fecha</th><th class="text-end">Acciones</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${despachos}">
                                <td><code th:text="${d.idDespacho}">1</code></td>
                                <td th:text="${d.solicitud.proyecto.codigo}">PROY-001</td>
                                <td th:text="${d.solicitud.idSolicitud}">S-001</td>
                                <td>
                                    <span class="badge" th:classappend="${d.tipo == 'PARCIAL'} ? 'bg-warning text-dark' : 'bg-success'"
                                          th:text="${d.tipo}">COMPLETO</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${d.estado == 'CONFIRMADO'} ? 'bg-primary' : 'bg-secondary'"
                                          th:text="${d.estado}">PREPARANDO</span>
                                </td>
                                <td th:text="${d.usuarioAlmacenero.nombreCompleto}">Almacenero</td>
                                <td th:text="${d.fechaDespacho}">2026-01-01</td>
                                <td class="text-end">
                                    <a th:href="@{/despacho/detalle/{id}(id=${d.idDespacho})}" class="btn btn-sm btn-outline-info">
                                        <i class="bi bi-eye"></i> Ver
                                    </a>
                                    <button sec:authorize="hasAnyRole('OPERARIO_ENSAMBLE','ADMINISTRADOR')"
                                            class="btn btn-sm btn-success"
                                            th:if="${d.estado == 'PREPARANDO'}"
                                            th:onclick="'confirmarEntrega(' + ${d.idDespacho} + ')'">
                                        <i class="bi bi-check-circle"></i> Confirmar recepción
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${despachos.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    No hay despachos registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function confirmarEntrega(idDespacho) {
        if (!confirm('¿Confirmas la recepción de este kit? Esta acción descuenta el stock y no se puede deshacer.')) return;
        const token = sessionStorage.getItem('jwt');
        const res = await fetch(`/api/despacho/${idDespacho}/confirmar`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          alert('Recepción confirmada. Stock descontado.');
          location.reload();
        } else {
          alert('Error al confirmar. Revisa la consola.');
        }
      }
    </script>
</body>
</html>
