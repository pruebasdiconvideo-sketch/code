<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalle Despacho - Smart Power On S.A.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>
    <div class="container-fluid py-4" th:if="${despacho != null}">
        <h1 class="h3 mb-3"><i class="bi bi-truck text-success"></i> Despacho #<span th:text="${despacho.idDespacho}">1</span></h1>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>Proyecto:</strong> <span th:text="${despacho.solicitud.proyecto.codigo + ' - ' + despacho.solicitud.proyecto.cliente}"></span></li>
                    <li class="list-group-item"><strong>Solicitud:</strong> #<span th:text="${despacho.solicitud.idSolicitud}"></span></li>
                    <li class="list-group-item"><strong>Almacenero:</strong> <span th:text="${despacho.usuarioAlmacenero.nombreCompleto}"></span></li>
                    <li class="list-group-item"><strong>Tipo:</strong> <span class="badge" th:classappend="${despacho.tipo == 'PARCIAL'} ? 'bg-warning text-dark' : 'bg-success'" th:text="${despacho.tipo}"></span></li>
                    <li class="list-group-item"><strong>Estado:</strong> <span class="badge" th:classappend="${despacho.estado == 'CONFIRMADO'} ? 'bg-primary' : 'bg-secondary'" th:text="${despacho.estado}"></span></li>
                </ul>
            </div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5><i class="bi bi-list-check"></i> Detalle de items entregados (RF16)</h5>
                <table class="table table-sm table-hover">
                    <thead class="table-success"><tr><th>Material</th><th>Código digitado</th><th>Cantidad entregada</th></tr></thead>
                    <tbody>
                        <tr th:each="d : ${despacho.detalles}">
                            <td th:text="${d.material.codigo + ' - ' + d.material.nombre}">MAT</td>
                            <td><code th:text="${d.codigoDigitado}">CODE</code></td>
                            <td th:text="${d.cantidadEntregada}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a th:href="@{/despacho/bandeja}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
