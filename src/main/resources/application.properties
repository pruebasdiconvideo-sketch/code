# =====================================================
#  Aplicacion: Sistema de Gestion de Procesos
#  Empresa   : Smart Power On S.A.C.
#  Stack     : Spring Boot 3.x + MySQL 8 + JWT
# =====================================================

# Puerto del servidor (evita conflictos con el 8080 por defecto)
server.port=8081

# ---------- Conexión a MySQL 8 ----------
# Nota: Usas el puerto 3307. Asegúrate de que tu MySQL local o Docker esté escuchando en ese puerto.
spring.datasource.url=jdbc:mysql://localhost:3307/db_smart_power_on?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=grupo8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP (por defecto en Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---------- JPA / Hibernate ----------
# 'validate' solo verifica que las entidades coincidan con el esquema SQL
# NO modifica la BD (esquema creado por db_smart_power_on.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ---------- JWT (RNF03) ----------
# Clave HS256 - en PRODUCCION sobrescribir con variable de entorno JWT_SECRET
app.jwt.secret=YmQ3ZjRjOTk4ZmI2MzRhMzBhYzRmMzI3YjA5NmYzZmIzNzQ1ZGUzYjVjNTVlM2E2MzBlNzZiZDgxNWE0MTVjNA==
# Tiempo de expiración del token en minutos (8 horas = 480 min)
app.jwt.expiration-minutes=480

# ---------- Spring Security (sesion de vistas Thymeleaf) ----------
# Cierre por inactividad (RF04) - 30 minutos
app.security.session-timeout-minutes=30

# ---------- OpenHTMLtoPDF (RF22 certificado) ----------
app.pdf.fonts-dir=classpath:/static/fonts/

# ---------- i18n / Localización (RNF14) ----------
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.smartpoweron=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n